{% extends "base.html" %}

{% block title %}创建新小说 - {{ super() }}{% endblock %}

{% block content %}
    <h2>创建一本新小说</h2>
    <div class="card">
        <form action="/novels/" method="post">
            <div>
                <label for="title">标题</label>
                <input type="text" id="title" name="title" placeholder="输入小说标题" required>
            </div>
            <div>
                <label for="author">作者</label>
                <input type="text" id="author" name="author" placeholder="输入作者名">
            </div>
            <div>
                <label for="description">简介</label>
                <textarea id="description" name="description" placeholder="简单介绍一下这本小说..."></textarea>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn btn-primary">创建</button>
                <a href="/" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
{% endblock %}
