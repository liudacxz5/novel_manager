{% extends "base.html" %}

{% block title %}创建新小说 - {{ super() }}{% endblock %}

{% block content %}
    <div class="breadcrumb">
        <a href="/">返回首页</a>
    </div>
    <div class="card">
        <h2>创建一本新小说</h2>
        <form action="/novels/" method="post">
            <div>
                <label for="title">小说标题</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div>
                <label for="author">作者 (可选)</label>
                <input type="text" id="author" name="author">
            </div>
            <div>
                <label for="description">简介 (可选)</label>
                <textarea id="description" name="description" rows="5"></textarea>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn btn-primary">创建小说</button>
                <a href="/" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
{% endblock %}
