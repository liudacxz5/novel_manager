{% extends "base.html" %}

{% block title %}编辑 {{ novel.title }} - {{ super() }}{% endblock %}

{% block content %}
    <div class="breadcrumb">
        <a href="/novels/{{ novel.id }}">返回《{{ novel.title }}》</a>
    </div>
    <div class="card">
        <h2>编辑小说：「{{ novel.title }}」</h2>
        <form action="/novels/{{ novel.id }}/edit" method="post">

            <div>
                <label for="title">小说标题</label>
                <input type="text" id="title" name="title" value="{{ novel.title }}" required>
            </div>

            <div>
                <label for="author">作者 (可选)</label>
                <input type="text" id="author" name="author" value="{{ novel.author or '' }}">
            </div>

            <div>
                <label for="description">简介 (可选)</label>
                <textarea id="description" name="description" rows="5">{{ novel.description or '' }}</textarea>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">保存更改</button>
                <a href="/novels/{{ novel.id }}" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
{% endblock %}
