<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}小说设定管理器{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header>
    <div class="container header-container">
        <h1><a href="/">小说设定管理器</a></h1>
        {% if user %}
            <div class="user-info">
                <span class="username">欢迎, {{ user.username }}</span>
                <form action="/logout" method="post" class="logout-form">
                    <button type="submit" class="btn btn-secondary btn-sm">登出</button>
                </form>
            </div>
        {% endif %}
    </div>
</header>

<div class="container content-wrapper">
    {% block content %}{% endblock %}
</div>

<footer>
    <div class="container">
        <p>&copy; 2024 小说设定管理器</p>
    </div>
</footer>

<!-- Modal for delete confirmation -->
<div class="modal-overlay" id="delete-confirm-modal">
    <div class="modal">
        <h3>确认删除</h3>
        <p>此操作不可逆，确定要删除吗？</p>
        <div class="modal-actions">
            <button id="modal-cancel-btn" class="btn btn-secondary">取消</button>
            <button id="modal-confirm-btn" class="btn btn-danger">确认删除</button>
        </div>
    </div>
</div>

<!-- Modal for export options -->
<div class="modal-overlay" id="export-modal">
    <div class="modal">
        <h3 id="export-modal-title">导出设定</h3>
        <form id="export-form">
            <div id="export-modal-body">
                <!-- Dynamic content will be injected here -->
            </div>
            <div class="modal-actions">
                <button type="button" id="export-cancel-btn" class="btn btn-secondary">取消</button>
                <button type="submit" class="btn btn-primary">确认导出</button>
            </div>
        </form>
    </div>
</div>

<!-- NEW: Modal for import -->
<div class="modal-overlay" id="import-modal">
    <div class="modal">
        <h3>导入设定</h3>
        <form id="import-form" method="post" enctype="multipart/form-data">
            <div id="import-modal-body">
                <p>请选择一个 `.md` 格式的设定文件进行上传。导入会覆盖同名条目的内容。</p>
                <input type="file" name="file" id="import-file-input" accept=".md, .markdown" required>
            </div>
            <div class="modal-actions">
                <button type="button" id="import-cancel-btn" class="btn btn-secondary">取消</button>
                <button type="submit" class="btn btn-primary">开始导入</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Global script for delete confirmation
    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('delete-confirm-modal');
        if (!modal) return;
        const cancelBtn = document.getElementById('modal-cancel-btn');
        const confirmBtn = document.getElementById('modal-confirm-btn');
        let formToSubmit = null;

        document.body.addEventListener('submit', function(e) {
            const form = e.target.closest('.delete-form');
            if (form) {
                e.preventDefault();
                formToSubmit = form;
                modal.classList.add('active');
            }
        });

        cancelBtn.addEventListener('click', () => {
            modal.classList.remove('active');
            formToSubmit = null;
        });

        confirmBtn.addEventListener('click', () => {
            if (formToSubmit) {
                formToSubmit.submit();
            }
        });

        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                modal.classList.remove('active');
                formToSubmit = null;
            }
        });
    });
</script>

{% block scripts %}{% endblock %}
</body>
</html>
