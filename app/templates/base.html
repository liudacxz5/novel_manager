<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}小说设定管理器{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header>
    <div class="container header-container">
        <h1><a href="/">小说设定管理器</a></h1>
        {% if user %}
            <div class="user-info">
                <span class="username">欢迎, {{ user.username }}</span>
                <form action="/logout" method="post" class="logout-form">
                    <button type="submit" class="btn btn-secondary btn-sm">登出</button>
                </form>
            </div>
        {% endif %}
    </div>
</header>

<div class="container content-wrapper">
    {% block content %}{% endblock %}
</div>

<footer>
    <div class="container">
        <p>&copy; 2024 小说设定管理器</p>
    </div>
</footer>

<!-- Modal for delete confirmation -->
<div class="modal-overlay" id="delete-confirm-modal">
    <div class="modal">
        <h3>确认删除</h3>
        <p>此操作不可逆，确定要删除吗？</p>
        <div class="modal-actions">
            <button id="modal-cancel-btn" class="btn btn-secondary">取消</button>
            <button id="modal-confirm-btn" class="btn btn-danger">确认删除</button>
        </div>
    </div>
</div>

<script>
    // Global script for delete confirmation
    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('delete-confirm-modal');
        if (!modal) return;
        const cancelBtn = document.getElementById('modal-cancel-btn');
        const confirmBtn = document.getElementById('modal-confirm-btn');
        let formToSubmit = null;

        // Use event delegation on the body for all forms with .delete-form
        document.body.addEventListener('submit', function(e) {
            // Check if the target or its parent form has the class
            const form = e.target.closest('.delete-form');
            if (form) {
                e.preventDefault();
                formToSubmit = form;
                modal.classList.add('active');
            }
        });

        cancelBtn.addEventListener('click', () => {
            modal.classList.remove('active');
            formToSubmit = null;
        });

        confirmBtn.addEventListener('click', () => {
            if (formToSubmit) {
                formToSubmit.submit();
            }
        });

        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                modal.classList.remove('active');
                formToSubmit = null;
            }
        });
    });
</script>

{% block scripts %}{% endblock %}
</body>
</html>
